# Scope: the gRPC and gRPC-Web protocols, which this library implements.
# Every feature the protocol scope allows is on. Failures are tracked in
# grpc.known_failing.txt rather than by switching features off here.
features:
  versions: [HTTP_VERSION_1, HTTP_VERSION_2]
  protocols: [PROTOCOL_GRPC, PROTOCOL_GRPC_WEB]
  codecs: [CODEC_PROTO, CODEC_JSON]
  compressions: [COMPRESSION_IDENTITY, COMPRESSION_GZIP]
  streamTypes:
    - STREAM_TYPE_UNARY
    - STREAM_TYPE_CLIENT_STREAM
    - STREAM_TYPE_SERVER_STREAM
    - STREAM_TYPE_HALF_DUPLEX_BIDI_STREAM
    - STREAM_TYPE_FULL_DUPLEX_BIDI_STREAM
  supportsH2c: true
  supportsTls: true
  # The server requires and pins the runner's client certificate (see Conformance.Main).
  supportsTlsClientCerts: true
  supportsTrailers: true
  # gRPC-Web over HTTP/1.1 can stream a request and then respond (Cowboy supports it).
  # Any failure of these cases is recorded in the known-failing list.
  supportsHalfDuplexBidiOverHttp1: true
  # Connect GET only applies to the Connect protocol, which is not in this scope.
  supportsConnectGet: false
  # The server applies the limit through the :max_message_length application setting.
  supportsMessageReceiveLimit: true
