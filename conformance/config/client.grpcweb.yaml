# Scope: the Elixir client speaking the gRPC-Web protocol, over HTTP/1.1 and HTTP/2.
# Measured with an empty known-failing list:
#   CLIENT_ADAPTER=mint conformance/run.sh config/client.grpcweb.yaml
#   CLIENT_ADAPTER=gun conformance/run.sh config/client.grpcweb.yaml
features:
  versions: [HTTP_VERSION_1, HTTP_VERSION_2]
  protocols: [PROTOCOL_GRPC_WEB]
  codecs: [CODEC_PROTO, CODEC_JSON]
  compressions: [COMPRESSION_IDENTITY, COMPRESSION_GZIP]
  streamTypes:
    - STREAM_TYPE_UNARY
    - STREAM_TYPE_CLIENT_STREAM
    - STREAM_TYPE_SERVER_STREAM
    - STREAM_TYPE_HALF_DUPLEX_BIDI_STREAM
    - STREAM_TYPE_FULL_DUPLEX_BIDI_STREAM
  supportsH2c: true
  supportsTls: true
  supportsTlsClientCerts: true
  supportsTrailers: true
  supportsHalfDuplexBidiOverHttp1: true
  # Connect GET only applies to the Connect protocol.
  supportsConnectGet: false
  supportsMessageReceiveLimit: true
