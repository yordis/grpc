# Scope: the Elixir gRPC client. It speaks only the gRPC protocol over HTTP/2, so
# there is no Connect or gRPC-Web transport to test and no HTTP/1.1.
features:
  versions: [HTTP_VERSION_2]
  protocols: [PROTOCOL_GRPC]
  codecs: [CODEC_PROTO, CODEC_JSON]
  compressions: [COMPRESSION_IDENTITY, COMPRESSION_GZIP]
  streamTypes:
    - STREAM_TYPE_UNARY
    - STREAM_TYPE_CLIENT_STREAM
    - STREAM_TYPE_SERVER_STREAM
    - STREAM_TYPE_HALF_DUPLEX_BIDI_STREAM
    - STREAM_TYPE_FULL_DUPLEX_BIDI_STREAM
  supportsH2c: true
  supportsTls: true
  supportsTlsClientCerts: true
  supportsTrailers: true
  # Only meaningful for HTTP/1.1, which gRPC does not use.
  supportsHalfDuplexBidiOverHttp1: false
  # Connect GET only applies to the Connect protocol.
  supportsConnectGet: false
  # Applied per call with the :max_receive_message_length option.
  supportsMessageReceiveLimit: true
